<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password - Argus</title>
<style>
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f4f2fb;
    display:flex;align-items:center;justify-content:center;
    height:100vh;margin:0;
  }
  .card{
    background:#fff;padding:32px;border-radius:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);width:340px;max-width:90vw;
  }
  h1{font-size:22px;margin:0 0 4px;color:#4b3fb0;}
  p.sub{font-size:13px;color:#777;margin:0 0 18px;}
  label{display:block;font-size:11.5px;font-weight:bold;color:#666;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em;}
  input{
    width:100%;padding:10px 12px;border:1.5px solid #e2dff5;
    border-radius:8px;font-size:14px;
  }
  input:focus{outline:none;border-color:#6c5ce7;box-shadow:0 0 0 3px rgba(108,92,231,0.12);}
  button{
    width:100%;margin-top:18px;padding:11px;background:#6c5ce7;color:#fff;
    border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;
  }
  button:active{transform:scale(.98);}
  .msg{font-size:13px;margin-top:14px;padding:10px 12px;border-radius:8px;display:none;line-height:1.4;}
  .msg.error{background:#fdeceb;color:#c0392b;display:block;}
  .msg.success{background:#eafaf0;color:#1a7f4f;display:block;}
</style>
</head>
<body>
<div class="card">
  <h1>Argus</h1>
  <p class="sub">Choose a new password</p>
  <div id="msg" class="msg"></div>
  <div id="form-area">
    <label>New password</label>
    <input id="new-password" type="password" placeholder="At least 8 characters" autocomplete="new-password">
    <label>Confirm new password</label>
    <input id="confirm-password" type="password" placeholder="Repeat password" autocomplete="new-password"
           onkeydown="if(event.key==='Enter')submitReset()">
    <button onclick="submitReset()">Reset password</button>
  </div>
</div>
<script>
function getToken() {
  return new URLSearchParams(window.location.search).get("token");
}

async function submitReset() {
  const msg = document.getElementById("msg");
  msg.className = "msg";
  const token = getToken();
  const pw1 = document.getElementById("new-password").value;
  const pw2 = document.getElementById("confirm-password").value;

  if (!token) {
    msg.textContent = "This link is missing its reset token. Request a new reset email.";
    msg.className = "msg error";
    return;
  }
  if (pw1.length < 8) {
    msg.textContent = "Password must be at least 8 characters.";
    msg.className = "msg error";
    return;
  }
  if (pw1 !== pw2) {
    msg.textContent = "Passwords don't match.";
    msg.className = "msg error";
    return;
  }

  try {
    const res = await fetch("/api/auth/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, new_password: pw1 }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Something went wrong.");

    msg.textContent = "Password updated. You can close this page and sign in with your new password.";
    msg.className = "msg success";
    document.getElementById("form-area").style.display = "none";
  } catch (e) {
    msg.textContent = e.message;
    msg.className = "msg error";
  }
}

if (!getToken()) {
  document.getElementById("msg").textContent =
    "This link looks incomplete. Make sure you opened it directly from the reset email.";
  document.getElementById("msg").className = "msg error";
}
</script>
</body>
</html>
